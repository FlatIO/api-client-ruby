name: Release

# Publishing is triggered by a version tag and nothing else (FR-019a).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for RubyGems trusted publishing (FR-021a)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: The tag must match the packaged version
        run: |
          # Every tag in this repository, and in api-reference, carries the v. The version
          # inside the package never does, so the tag is compared with it stripped.
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(ruby -Ilib -e "require 'flat_api/version'; print FlatApi::VERSION")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != VERSION $PKG"; exit 1; }

      - run: gem build flat_api.gemspec

      # No API key: RubyGems trusts this repository and workflow by OIDC. The credentials action
      # rather than rubygems/release-gem, which runs `rake release`: that task pushes a git tag
      # before it pushes the gem, and here the tag already exists and is what triggered this run,
      # so it failed on a detached HEAD with `src refspec refs/heads/HEAD does not match any` and
      # never reached the upload. Tagging is tag-on-merge.yml's job, publishing is this one's.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Attestations are generated by rubygems itself when it publishes over trusted publishing.
      - name: Skip the publish if this version is already on RubyGems
        id: published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ( cd "$(mktemp -d)" && gem fetch flat_api --version "$VERSION" >/dev/null 2>&1 ); then
            echo "flat_api $VERSION is already on RubyGems; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to RubyGems (trusted publishing)
        if: steps.published.outputs.skip != 'true'
        run: gem push "flat_api-$(cat VERSION).gem"

      # The push is accepted asynchronously, so confirm the version is actually fetchable rather
      # than reporting a green release for a gem nobody can install yet.
      - name: Wait for the release to appear on RubyGems
        run: |
          VERSION="$(cat VERSION)"
          # Fetched into a scratch directory: gem fetch writes into the working directory, which
          # already holds the gem this job just built, and a check that can read its own output is
          # not a check. No --no-document here either: gem fetch rejects it, which made the first
          # version of this step fail on every attempt for five minutes while the push had in fact
          # succeeded, reporting a red release for a gem that was live.
          WORK="$(mktemp -d)"
          for _ in $(seq 1 30); do
            if ( cd "$WORK" && gem fetch flat_api --version "$VERSION" >/dev/null 2>&1 ); then
              echo "flat_api $VERSION is published and downloadable"
              exit 0
            fi
            sleep 10
          done
          echo "flat_api $VERSION did not appear on RubyGems within five minutes. Last attempt:"
          ( cd "$WORK" && gem fetch flat_api --version "$VERSION" ) || true
          exit 1

      # The tag alone left the repository's Releases page showing a version from years ago as
      # "Latest", which is what anyone browsing the repository sees first. The notes come from the
      # CHANGELOG section for this version, so the release says what changed rather than nothing.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          [ -n "$NOTES" ] || NOTES="See CHANGELOG.md for $VERSION."
          # Creating one that exists is an error, and a re-run of a release that already happened
          # should be a no-op rather than a red build.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          fi

schema_version: 1

language: ruby
package_name: flat_api
registry: rubygems

generator:
  name: ruby
  version: 7.24.0
  config: tools/openapi-config.json

generated_paths:
  - lib/**
  - docs/reference/**
  - .openapi-generator/**
  - OPERATIONS.json

version_file:
  path: lib/flat_api/version.rb
  pattern: "VERSION = '(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)'"

runtime_matrix:
  - version: '3.3'
    upstream_eol: 2027-03-31
  - version: '3.4'
    upstream_eol: 2028-03-31

smoke:
  entrypoint: tools/smoke.rb
